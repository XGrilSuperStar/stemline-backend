<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews — Stemline</title>
<style>
  :root {
    --bg: #0b0f10;
    --panel: #14191b;
    --border: #232b2d;
    --teal: #3CFDE0;
    --amber: #ffb454;
    --text: #e8f0ef;
    --text-dim: #8fa3a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  a.back { color: var(--teal); text-decoration: none; font-size: 0.9rem; }
  h1 { font-size: 1.8rem; margin: 20px 0 6px; }
  .sub { color: var(--text-dim); margin-bottom: 32px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 28px;
  }
  .panel h2 { margin-top: 0; font-size: 1.1rem; }

  .stars { display: flex; gap: 6px; margin: 10px 0 16px; }
  .star-btn {
    background: none;
    border: none;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
    color: #3a4547;
    padding: 0;
  }
  .star-btn.filled { color: var(--amber); }

  textarea, input[type="text"] {
    width: 100%;
    background: #0e1314;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { min-height: 100px; resize: vertical; margin-top: 12px; }
  label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }

  .submit-btn {
    margin-top: 16px;
    background: var(--teal);
    color: #062120;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  .status-msg { margin-top: 12px; font-size: 0.9rem; }
  .status-msg.ok { color: var(--teal); }
  .status-msg.err { color: #ff6b6b; }

  .review-card {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  .review-card:last-child { border-bottom: none; }
  .review-top { display: flex; justify-content: space-between; align-items: baseline; }
  .review-name { font-weight: 600; }
  .review-date { color: var(--text-dim); font-size: 0.8rem; }
  .review-stars { color: var(--amber); margin: 4px 0 8px; letter-spacing: 2px; }
  .review-comment { color: var(--text); line-height: 1.5; white-space: pre-wrap; }

  .empty { color: var(--text-dim); font-style: italic; }

  .admin-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .admin-actions { margin-top: 10px; display: flex; gap: 10px; }
  .admin-actions button {
    border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
  }
  .approve-btn { background: var(--teal); color: #062120; }
  .reject-btn { background: #2a2020; color: #ff8080; border: 1px solid #4a2c2c !important; }

  #loginNotice { color: var(--text-dim); font-size: 0.9rem; }
  #loginNotice a { color: var(--teal); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; Back to Stemline</a>
  <h1>What people are saying</h1>
  <p class="sub">Real reviews from Stemline users.</p>

  <div class="panel" id="submitPanel">
    <h2>Leave a review</h2>
    <div id="loginNotice" style="display:none;">Log in on the main app first, then come back here to leave a review.</div>
    <form id="reviewForm">
      <label>Your name (shown publicly)</label>
      <input type="text" id="displayName" maxlength="80" required>
      <label style="margin-top:12px;">Rating</label>
      <div class="stars" id="starPicker">
        <button type="button" class="star-btn" data-val="1">&#9733;</button>
        <button type="button" class="star-btn" data-val="2">&#9733;</button>
        <button type="button" class="star-btn" data-val="3">&#9733;</button>
        <button type="button" class="star-btn" data-val="4">&#9733;</button>
        <button type="button" class="star-btn" data-val="5">&#9733;</button>
      </div>
      <label>Your review</label>
      <textarea id="comment" maxlength="2000" required placeholder="What did you think of Stemline?"></textarea>
      <button type="submit" class="submit-btn" id="submitBtn">Submit for review</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <div class="panel" id="adminPanel" style="display:none;">
    <h2>Pending approval</h2>
    <div id="pendingList"></div>
  </div>

  <div class="panel">
    <h2>Reviews</h2>
    <div id="publicList"><p class="empty">Loading…</p></div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

function getToken() {
  return localStorage.getItem('soundlounge101_token') || null;
}

let selectedStars = 0;
document.querySelectorAll('.star-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedStars = parseInt(btn.dataset.val, 10);
    document.querySelectorAll('.star-btn').forEach(b => {
      b.classList.toggle('filled', parseInt(b.dataset.val, 10) <= selectedStars);
    });
  });
});

async function loadPublicReviews() {
  const list = document.getElementById('publicList');
  try {
    const res = await fetch(API_BASE + '/api/v1/reviews');
    const reviews = await res.json();
    if (!reviews.length) {
      list.innerHTML = '<p class="empty">No reviews yet — be the first!</p>';
      return;
    }
    list.innerHTML = reviews.map(r => `
      <div class="review-card">
        <div class="review-top">
          <span class="review-name">${escapeHtml(r.display_name)}</span>
          <span class="review-date">${formatDate(r.created_at)}</span>
        </div>
        <div class="review-stars">${'&#9733;'.repeat(r.stars)}${'&#9734;'.repeat(5 - r.stars)}</div>
        <div class="review-comment">${escapeHtml(r.comment)}</div>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = '<p class="empty">Could not load reviews right now.</p>';
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

document.getElementById('reviewForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const statusMsg = document.getElementById('statusMsg');
  const token = getToken();
  if (!token) {
    statusMsg.textContent = 'Please log in on the main app first.';
    statusMsg.className = 'status-msg err';
    return;
  }
  if (selectedStars < 1) {
    statusMsg.textContent = 'Please pick a star rating.';
    statusMsg.className = 'status-msg err';
    return;
  }
  const displayName = document.getElementById('displayName').value.trim();
  const comment = document.getElementById('comment').value.trim();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  try {
    const res = await fetch(API_BASE + '/api/v1/reviews?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ display_name: displayName, stars: selectedStars, comment })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || ('Server returned ' + res.status));
    }
    statusMsg.textContent = 'Thanks! Your review is pending approval.';
    statusMsg.className = 'status-msg ok';
    document.getElementById('reviewForm').reset();
    selectedStars = 0;
    document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('filled'));
  } catch (err) {
    statusMsg.textContent = 'Could not submit: ' + err.message;
    statusMsg.className = 'status-msg err';
  } finally {
    submitBtn.disabled = false;
  }
});

// Admin panel: only shown if this account's pending-reviews call succeeds
// (backend rejects non-admin accounts with 403), so it stays invisible to
// everyone but the admin account without any frontend-side gating to spoof.
async function loadAdminPanel() {
  const token = getToken();
  if (!token) return;
  try {
    const res = await fetch(API_BASE + '/api/v1/admin/reviews/pending?token=' + encodeURIComponent(token));
    if (!res.ok) return; // not admin, or not logged in — stay hidden
    const pending = await res.json();
    const panel = document.getElementById('adminPanel');
    const list = document.getElementById('pendingList');
    panel.style.display = 'block';
    if (!pending.length) {
      list.innerHTML = '<p class="empty">Nothing waiting on approval.</p>';
      return;
    }
    list.innerHTML = pending.map(r => `
      <div class="admin-card" data-id="${r.id}">
        <div class="review-top">
          <span class="review-name">${escapeHtml(r.display_name)}</span>
          <span class="review-date">${formatDate(r.created_at)}</span>
        </div>
        <div class="review-stars">${'&#9733;'.repeat(r.stars)}${'&#9734;'.repeat(5 - r.stars)}</div>
        <div class="review-comment">${escapeHtml(r.comment)}</div>
        <div class="admin-actions">
          <button class="approve-btn" data-action="approve" data-id="${r.id}">Approve</button>
          <button class="reject-btn" data-action="reject" data-id="${r.id}">Reject</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const url = action === 'approve'
          ? API_BASE + '/api/v1/admin/reviews/' + id + '/approve?token=' + encodeURIComponent(token)
          : API_BASE + '/api/v1/admin/reviews/' + id + '?token=' + encodeURIComponent(token);
        const method = action === 'approve' ? 'POST' : 'DELETE';
        btn.disabled = true;
        try {
          await fetch(url, { method });
          loadAdminPanel();
          if (action === 'approve') loadPublicReviews();
        } catch (e) {
          btn.disabled = false;
        }
      });
    });
  } catch (e) {
    // silently stay hidden
  }
}

loadPublicReviews();
loadAdminPanel();
</script>
</body>
</html>
